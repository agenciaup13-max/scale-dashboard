<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scale — Saúde da Carteira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #080808;
      --surface:  #111111;
      --surface2: #181818;
      --border:   #232323;
      --border2:  #2e2e2e;
      --text:     #f0f0f0;
      --muted:    #6b6b6b;
      --dim:      #3a3a3a;
      --green:    #22c55e;
      --green-bg: #061510;
      --green-border: #14532d;
      --yellow:   #f59e0b;
      --yellow-bg: #120d00;
      --yellow-border: #78350f;
      --red:      #ef4444;
      --red-bg:   #120404;
      --red-border: #7f1d1d;
      --ai-bg:    #0d0d1a;
      --ai-border:#2a2850;
      --ai-text:  #a5b4fc;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── HEADER ── */
    .header {
      border-bottom: 1px solid var(--border);
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: rgba(8,8,8,0.92);
      backdrop-filter: blur(12px);
      z-index: 100;
    }
    .logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #fff;
      text-transform: uppercase;
    }
    .logo span {
      display: inline-block;
      border: 2px solid #fff;
      padding: 1px 10px 1px 8px;
      margin-right: 10px;
      font-size: 22px;
    }
    .header-meta {
      text-align: right;
    }
    .week-badge {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border2);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .updated-at {
      font-size: 11px;
      color: var(--dim);
    }

    /* ── MAIN ── */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 40px 80px;
    }

    /* ── SECTION TITLE ── */
    .section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    /* ── MACRO ── */
    .macro-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 280px;
      gap: 16px;
      margin-bottom: 48px;
    }

    .status-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
    }
    .status-card:hover { transform: translateY(-2px); }
    .status-card.green  { border-color: var(--green-border); background: var(--green-bg); }
    .status-card.yellow { border-color: var(--yellow-border); background: var(--yellow-bg); }
    .status-card.red    { border-color: var(--red-border); background: var(--red-bg); }
    .status-card.active-filter { box-shadow: 0 0 0 2px currentColor; }

    .card-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-label .dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .green .card-label { color: var(--green); }
    .yellow .card-label { color: var(--yellow); }
    .red .card-label { color: var(--red); }
    .green .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .yellow .dot { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
    .red .dot { background: var(--red); box-shadow: 0 0 8px var(--red); animation: pulse 2s infinite; }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 6px var(--red); }
      50% { box-shadow: 0 0 14px var(--red); }
    }

    .card-number {
      font-size: 52px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 6px;
      letter-spacing: -2px;
    }
    .green  .card-number { color: var(--green); }
    .yellow .card-number { color: var(--yellow); }
    .red    .card-number { color: var(--red); }

    .card-pct {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }
    .card-clients-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* SCORE CARD */
    .score-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .score-ring-wrap {
      position: relative;
      width: 110px;
      height: 110px;
    }
    .score-ring-wrap svg {
      transform: rotate(-90deg);
    }
    .score-value {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
    }
    .score-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }
    .health-bar {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--surface2);
      overflow: hidden;
      display: flex;
      margin-top: 4px;
    }
    .health-bar .seg-g { background: var(--green); }
    .health-bar .seg-y { background: var(--yellow); }
    .health-bar .seg-r { background: var(--red); }

    /* ── MANAGER GRID ── */
    .manager-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 48px;
    }

    .manager-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 18px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
    }
    .manager-card:hover, .manager-card.active { border-color: var(--border2); transform: translateY(-1px); }
    .manager-card.active { border-color: #fff; }

    .manager-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #fff;
    }
    .manager-stats {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .mgr-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .mgr-stat .n { font-size: 20px; font-weight: 700; line-height: 1; }
    .mgr-stat .l { font-size: 10px; font-weight: 500; letter-spacing: 0.5px; color: var(--muted); }
    .n.g { color: var(--green); }
    .n.y { color: var(--yellow); }
    .n.r { color: var(--red); }

    .mgr-bar {
      height: 4px;
      border-radius: 2px;
      background: var(--surface2);
      overflow: hidden;
      display: flex;
    }

    .mgr-score-pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 10px;
    }
    .score-high   { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }
    .score-mid    { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
    .score-low    { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-border); }
    .manager-total { font-size: 10px; color: var(--muted); margin-top: 6px; }

    /* ── FILTER BAR ── */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'Inter', sans-serif;
    }
    .filter-btn:hover { border-color: var(--border2); color: var(--text); }
    .filter-btn.active { background: #fff; color: #000; border-color: #fff; }
    .filter-separator { width: 1px; height: 28px; background: var(--border); }

    /* ── CLIENT CARDS ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(600px, 1fr));
      gap: 16px;
    }

    .client-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.15s;
    }
    .client-card:hover { border-color: var(--border2); transform: translateY(-1px); }
    .client-card.red   { border-left: 3px solid var(--red); }
    .client-card.yellow { border-left: 3px solid var(--yellow); }

    .card-header {
      padding: 18px 20px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .card-header-left { flex: 1; }

    .card-status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .status-pill.red    { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-border); }
    .status-pill.yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }

    .manager-pill {
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      background: var(--surface2);
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .funil-pill {
      font-size: 10px;
      font-weight: 500;
      color: var(--dim);
      background: var(--surface2);
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .client-name {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .card-chevron {
      color: var(--muted);
      font-size: 18px;
      flex-shrink: 0;
      transition: transform 0.2s;
      margin-top: 4px;
    }
    .card-chevron.open { transform: rotate(180deg); }

    .card-body {
      padding: 0 20px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.2s;
    }
    .card-body.open {
      max-height: 2000px;
      padding: 20px 20px;
    }

    .info-block {
      margin-bottom: 16px;
    }
    .info-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .info-text {
      font-size: 13px;
      color: var(--text);
      line-height: 1.65;
    }

    /* CLAUDE INSIGHT */
    .insight-block {
      background: var(--ai-bg);
      border: 1px solid var(--ai-border);
      border-radius: 10px;
      padding: 16px 18px;
      margin-top: 4px;
    }
    .insight-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .insight-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--ai-text);
      background: rgba(99,102,241,0.15);
      border: 1px solid var(--ai-border);
      padding: 2px 10px;
      border-radius: 10px;
    }
    .insight-text {
      font-size: 13px;
      color: #c7d2fe;
      line-height: 1.7;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      grid-column: 1 / -1;
    }
    .empty-state .big { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-logo { font-size: 14px; font-weight: 800; color: var(--dim); letter-spacing: 1px; }
    .footer-info { font-size: 11px; color: var(--muted); text-align: right; }

    /* ── RESPONSIVE ── */
    @media (max-width: 1100px) {
      .macro-grid { grid-template-columns: 1fr 1fr; }
      .manager-grid { grid-template-columns: repeat(3, 1fr); }
      .cards-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      main { padding: 24px 16px 60px; }
      .header { padding: 16px 20px; }
      .macro-grid { grid-template-columns: 1fr; }
      .manager-grid { grid-template-columns: repeat(2, 1fr); }
      .logo { font-size: 20px; }
    }
  </style>
</head>

<!-- HEADER -->
<header class="header">

  <!-- FILTER BAR -->
  <div class="filter-bar">

  </div>

  <!-- CLIENT CARDS -->
  <div class="section-title">Clientes que precisam de ação</div>
  <div class="cards-grid" id="cardsGrid"></div>

</main>

<footer>
  <div class="footer-logo">SCALE</div>
  <div class="footer-info">
    Atualiza toda quarta-feira às 05h00 BRT<br>
    Dados: ClickUp War Rooms
  </div>
</footer>

// ─────────────────────────────────────────────
//  RENDER ENGINE
// ─────────────────────────────────────────────
(function () {
  // Aggregate
  let totalGreen = 0, totalYellow = 0, totalRed = 0;
  DATA.managers.forEach(m => {
    totalGreen  += m.verde.length;
    totalYellow += m.clients.filter(c => c.status === 'yellow').length;
    totalRed    += m.clients.filter(c => c.status === 'red').length;
  });
  const total = totalGreen + totalYellow + totalRed;
  const score = Math.round((totalGreen * 100 + totalYellow * 50) / total);

  // Header
  document.getElementById('weekBadge').textContent = 'Semana ' + DATA.week;
  document.getElementById('updatedAt').textContent = 'Atualizado em ' + DATA.updatedAt;

  // Macro cards
  document.getElementById('numGreen').textContent  = totalGreen;
  document.getElementById('numYellow').textContent = totalYellow;
  document.getElementById('numRed').textContent    = totalRed;
  document.getElementById('pctGreen').textContent  = ((totalGreen  / total) * 100).toFixed(1) + '%';
  document.getElementById('pctYellow').textContent = ((totalYellow / total) * 100).toFixed(1) + '%';
  document.getElementById('pctRed').textContent    = ((totalRed    / total) * 100).toFixed(1) + '%';
  document.getElementById('scoreValue').textContent = score;

  // Score ring
  const circ = 2 * Math.PI * 46; // ~289
  const offset = circ - (score / 100) * circ;
  const ringColor = score >= 70 ? '#22c55e' : score >= 50 ? '#f59e0b' : '#ef4444';
  const sc = document.getElementById('scoreCircle');
  sc.style.strokeDasharray  = circ;
  sc.style.strokeDashoffset = circ;
  sc.style.stroke = ringColor;
  setTimeout(() => { sc.style.transition = 'stroke-dashoffset 1.2s ease'; sc.style.strokeDashoffset = offset; }, 200);

  // Global health bar
  const ghb = document.getElementById('globalHealthBar');
  ghb.innerHTML =
    `<div class="seg-g" style="width:${(totalGreen /total*100).toFixed(1)}%"></div>` +
    `<div class="seg-y" style="width:${(totalYellow/total*100).toFixed(1)}%"></div>` +
    `<div class="seg-r" style="width:${(totalRed   /total*100).toFixed(1)}%"></div>`;

  // Manager grid
  const mgGrid = document.getElementById('managerGrid');
  DATA.managers.forEach(m => {
    const v = m.verde.length;
    const y = m.clients.filter(c => c.status === 'yellow').length;
    const r = m.clients.filter(c => c.status === 'red').length;
    const t = v + y + r;
    const ms = Math.round((v * 100 + y * 50) / t);
    const scoreClass = ms >= 70 ? 'score-high' : ms >= 50 ? 'score-mid' : 'score-low';

    const card = document.createElement('div');
    card.className = 'manager-card';
    card.dataset.manager = m.name;
    card.innerHTML = `
      <div class="manager-name">${m.name}</div>
      <div class="manager-stats">
        <div class="mgr-stat"><div class="n g">${v}</div><div class="l">Saudáveis</div></div>
        <div class="mgr-stat"><div class="n y">${y}</div><div class="l">Atenção</div></div>
        <div class="mgr-stat"><div class="n r">${r}</div><div class="l">Críticos</div></div>
      </div>
      <div class="mgr-bar">
        <div class="seg-g" style="width:${(v/t*100).toFixed(0)}%"></div>
        <div class="seg-y" style="width:${(y/t*100).toFixed(0)}%"></div>
        <div class="seg-r" style="width:${(r/t*100).toFixed(0)}%"></div>
      </div>
      <div class="mgr-score-pill ${scoreClass}">Score ${ms}/100</div>
      <div class="manager-total">${t} clientes na carteira</div>
    `;
    card.addEventListener('click', () => filterManager(m.name, card));
    mgGrid.appendChild(card);
  });

  // Manager filter buttons
  const mfb = document.getElementById('managerFilterBtns');
  DATA.managers.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.manager = m.name;
    btn.textContent = m.name;
    btn.addEventListener('click', () => filterManager(m.name, btn));
    mfb.appendChild(btn);
  });

  // All alert clients (red first, then yellow)
  const allAlerts = [];
  DATA.managers.forEach(m => {
    m.clients.filter(c => c.status === 'red').forEach(c => allAlerts.push({...c, manager: m.name}));
    m.clients.filter(c => c.status === 'yellow').forEach(c => allAlerts.push({...c, manager: m.name}));
  });

  window._allAlerts = allAlerts;
  window._statusFilter = 'all';
  window._managerFilter = null;

  renderCards();

  // ── Donut animation on load
  window.addEventListener('load', () => {
    setTimeout(() => { sc.style.strokeDashoffset = offset; }, 100);
  });
})();

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';
  const sf = window._statusFilter;
  const mf = window._managerFilter;

  let filtered = window._allAlerts;
  if (sf === 'red')    filtered = filtered.filter(c => c.status === 'red');
  if (sf === 'yellow') filtered = filtered.filter(c => c.status === 'yellow');
  if (mf)              filtered = filtered.filter(c => c.manager === mf);

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="big">✦</div><p>Nenhum cliente encontrado para este filtro</p></div>';
    return;
  }

  filtered.forEach((c, idx) => {
    const card = document.createElement('div');
    card.className = 'client-card ' + c.status;
    const statusLabel = c.status === 'red' ? '🔴 Crítico' : '🟡 Atenção';
    card.innerHTML = `
      <div class="card-header" onclick="toggleCard(this)">
        <div class="card-header-left">
          <div class="card-status-row">
            <span class="status-pill ${c.status}">${statusLabel}</span>
            <span class="manager-pill">${c.manager}</span>
            <span class="funil-pill">${c.funil}</span>
          </div>
          <div class="client-name">${c.nome}</div>
        </div>
        <div class="card-chevron">›</div>
      </div>
      <div class="card-body ${idx < 3 ? 'open' : ''}">
        <div class="info-block">
          <div class="info-label">Problema</div>
          <div class="info-text">${c.problema}</div>
        </div>
        <div class="info-block">
          <div class="info-label">O que os dados mostram</div>
          <div class="info-text">${c.dados}</div>
        </div>
        <div class="info-block">
          <div class="info-label">O que já foi tentado</div>
          <div class="info-text">${c.tentou}</div>
        </div>
        <div class="info-block">
          <div class="info-label">Sugestão do gestor</div>
          <div class="info-text">${c.sugestao}</div>
        </div>
        <div class="insight-block">
          <div class="insight-header">
            <span class="insight-badge">✦ Insight Claude</span>
          </div>
          <div class="insight-text">${c.insight}</div>
        </div>
      </div>
    `;
    // Fix chevron for open cards
    if (idx < 3) {
      const ch = card.querySelector('.card-chevron');
      ch.textContent = '›';
      ch.classList.add('open');
    }
    grid.appendChild(card);
  });
}

function toggleCard(header) {
  const body = header.nextElementSibling;
  const ch   = header.querySelector('.card-chevron');
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  ch.classList.toggle('open', !isOpen);
}

let _activeMgr = null;
function filterManager(name, el) {
  const isSame = window._managerFilter === name;
  window._managerFilter = isSame ? null : name;
  _activeMgr = isSame ? null : name;

  // Sync manager card
  document.querySelectorAll('.manager-card').forEach(c => c.classList.toggle('active', c.dataset.manager === _activeMgr));
  // Sync manager filter btn
  document.querySelectorAll('[data-manager]').forEach(b => b.classList.toggle('active', b.dataset.manager === _activeMgr));

  renderCards();
}

function filterStatus(s) {
  window._statusFilter = s;

  // Sync buttons
  document.getElementById('btnAll').classList.toggle('active',    s === 'all');
  document.getElementById('btnYellow').classList.toggle('active', s === 'yellow');
  document.getElementById('btnRed').classList.toggle('active',    s === 'red');

  // Sync status cards
  document.getElementById('cardGreen').classList.toggle('active-filter',  s === 'green');
  document.getElementById('cardYellow').classList.toggle('active-filter', s === 'yellow');
  document.getElementById('cardRed').classList.toggle('active-filter',    s === 'red');

  // If green clicked, show empty (no cards for green)
  if (s === 'green') {
    document.getElementById('cardsGrid').innerHTML = '<div class="empty-state"><div class="big">🟢</div><p>Clientes saudáveis — nenhuma ação necessária</p></div>';
    return;
  }
  renderCards();
}
</script>
